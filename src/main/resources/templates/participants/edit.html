<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Modifica partecipante - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


    <main class="container">


        <a
            class="back-link"
            th:href="@{/trips/{id}(id=${trip.id})}">

            ← Torna al viaggio

        </a>


        <h1>
            Modifica partecipante
        </h1>


        <p>

            Viaggio:

            <strong th:text="${trip.name}">
                Nome viaggio
            </strong>

        </p>


        <form
            th:action="@{/trips/{tripId}/participants/{participantId}/edit(
                tripId=${trip.id},
                participantId=${participant.id}
            )}"
            method="post">


            <!-- NOME -->

            <div>

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    th:value="${participant.name}"
                    required>

            </div>


            <br>


            <!-- EMAIL -->

            <div>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    th:value="${participant.email}"
                    required>

            </div>


            <br>


            <button
                class="button"
                type="submit">

                Salva modifiche

            </button>


            <a
                class="button button-secondary"
                th:href="@{/trips/{id}(id=${trip.id})}">

                Annulla

            </a>


        </form>


    </main>


</body>

</html>
