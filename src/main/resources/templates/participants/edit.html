<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Modifica partecipante - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


<main class="compact-form-page">


    <a
        class="back-link"
        th:href="@{/trips/{id}(id=${trip.id})}">

        ← Torna al viaggio

    </a>



    <section class="compact-form-card">


        <div class="compact-form-header">


            <span>
                PARTECIPANTI
            </span>


            <h1>
                Modifica partecipante
            </h1>


            <p>

                Viaggio:

                <strong th:text="${trip.name}">
                    Nome viaggio
                </strong>

            </p>


        </div>



        <form
            class="travelly-form"
            th:action="@{/trips/{tripId}/participants/{participantId}/edit(
                tripId=${trip.id},
                participantId=${participant.id}
            )}"
            method="post">


            <div class="travelly-field">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    th:value="${participant.name}"
                    required>

            </div>



            <div class="travelly-field">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    th:value="${participant.email}"
                    required>

            </div>



            <div class="travelly-form-actions">


                <a
                    class="form-cancel-button"
                    th:href="@{/trips/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Salva modifiche

                    <span>→</span>

                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
