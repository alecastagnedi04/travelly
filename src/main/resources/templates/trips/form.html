<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Crea viaggio - Travelly</title>
</head>

<body>

    <h1>Crea un nuovo viaggio</h1>

    <p>Inserisci le informazioni principali del tuo viaggio.</p>

    <form th:action="@{/trips}" method="post">

        <div>
            <label for="name">Nome del viaggio</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="255"
                required>
        </div>

        <br>

        <div>
            <label for="description">Descrizione</label>
            <textarea
                id="description"
                name="description"
                maxlength="255"></textarea>
        </div>

        <br>

        <div>
            <label for="startDate">Data di partenza</label>
            <input
                type="date"
                id="startDate"
                name="startDate"
                required>
        </div>

        <br>

        <div>
            <label for="endDate">Data di ritorno</label>
            <input
                type="date"
                id="endDate"
                name="endDate"
                required>
        </div>

        <br>

        <div>
            <label for="budget">Budget (€)</label>
            <input
                type="number"
                id="budget"
                name="budget"
                min="0"
                step="0.01"
                required>
        </div>

        <br>

        <button type="submit">Salva viaggio</button>

    </form>

    <br>

    <a href="/trips">Torna ai miei viaggi</a>

</body>

</html>
