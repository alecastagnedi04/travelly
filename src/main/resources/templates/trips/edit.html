<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Modifica viaggio - Travelly</title>
</head>

<body>

    <h1>Modifica viaggio</h1>

    <form th:action="@{/trips/{id}/edit(id=${trip.id})}" method="post">

        <div>
            <label for="name">Nome del viaggio</label>
            <input
                type="text"
                id="name"
                name="name"
                th:value="${trip.name}"
                required>
        </div>

        <br>

        <div>
            <label for="description">Descrizione</label>

            <textarea
                id="description"
                name="description"
                th:text="${trip.description}">
            </textarea>
        </div>

        <br>

        <div>
            <label for="startDate">Data di partenza</label>
            <input
                type="date"
                id="startDate"
                name="startDate"
                th:value="${trip.startDate}"
                required>
        </div>

        <br>

        <div>
            <label for="endDate">Data di ritorno</label>
            <input
                type="date"
                id="endDate"
                name="endDate"
                th:value="${trip.endDate}"
                required>
        </div>

        <br>

        <div>
            <label for="budget">Budget (€)</label>
            <input
                type="number"
                id="budget"
                name="budget"
                step="0.01"
                min="0"
                th:value="${trip.budget}"
                required>
        </div>

        <br>

        <button type="submit">Salva modifiche</button>

    </form>

    <br>

    <a th:href="@{/trips/{id}(id=${trip.id})}">
        Annulla
    </a>

</body>

</html>
