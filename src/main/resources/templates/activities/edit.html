<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Modifica attività - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<div th:replace="~{fragments/navbar :: siteNavbar}"></div>


<main class="compact-form-page">


    <a
        class="back-link"
        th:href="@{/trips/{id}(id=${trip.id})}">

        ← Torna al viaggio

    </a>



    <section class="compact-form-card">


        <div class="compact-form-header">


            <span>
                ATTIVITÀ
            </span>


            <h1>
                Modifica attività
            </h1>


            <p>

                Viaggio:

                <strong th:text="${trip.name}">
                    Nome viaggio
                </strong>

            </p>


        </div>

<div
    class="form-error-box"
    th:if="${activityError != null}"
    th:text="${activityError}">

    Errore attività

</div>

        <form
            class="travelly-form"
            th:action="@{/trips/{tripId}/activities/{activityId}/edit(
                tripId=${trip.id},
                activityId=${activity.id}
            )}"
            method="post">


            <div class="travelly-field">

                <label for="name">
                    Nome attività
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    th:value="${activity.name}"
                    required>

            </div>



            <div class="travelly-field">

                <label for="description">
                    Descrizione
                </label>

                <textarea
                    id="description"
                    name="description"
                    th:text="${activity.description}">
                </textarea>

            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="date">
                        Data
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        th:value="${activity.date}"
                        required>

                </div>



                <div class="travelly-field">

                    <label for="time">
                        Ora
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        th:value="${activity.time}"
                        required>

                </div>


            </div>



            <div class="travelly-field">

                <label for="location">
                    Luogo
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    th:value="${activity.location}"
                    required>

            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="category">
                        Categoria
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>


                        <option
                            th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category}"
                            th:selected="${category == activity.category}">
                        </option>


                    </select>

                </div>



                <div class="travelly-field">

                    <label for="cost">
                        Costo (€)
                    </label>

                    <input
                        type="number"
                        id="cost"
                        name="cost"
                        min="0"
                        step="0.01"
                        th:value="${activity.cost}"
                        required>

                </div>


            </div>



            <div class="travelly-form-actions">


                <a
                    class="form-cancel-button"
                    th:href="@{/trips/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Salva modifiche

                    <span>→</span>

                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
