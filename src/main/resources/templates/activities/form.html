<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Aggiungi attività - Travelly</title>
</head>

<body>

    <h1>Aggiungi attività</h1>

    <p>
        Viaggio:
        <strong th:text="${trip.name}">
            Nome viaggio
        </strong>
    </p>


    <form
        th:action="@{/trips/{tripId}/activities(tripId=${trip.id})}"
        method="post">


        <div>
            <label for="name">Nome</label>

            <input
                type="text"
                id="name"
                name="name"
                required>
        </div>


        <br>


        <div>
            <label for="description">
                Descrizione
            </label>

            <textarea
                id="description"
                name="description"></textarea>
        </div>


        <br>


        <div>
            <label for="date">Data</label>

            <input
                type="date"
                id="date"
                name="date"
                required>
        </div>


        <br>


        <div>
            <label for="time">Ora</label>

            <input
                type="time"
                id="time"
                name="time"
                required>
        </div>


        <br>


        <div>
            <label for="location">
                Luogo
            </label>

            <input
                type="text"
                id="location"
                name="location"
                required>
        </div>


        <br>


        <div>

            <label for="category">
                Categoria
            </label>

            <select
                id="category"
                name="category"
                required>

                <option
                    th:each="category : ${categories}"
                    th:value="${category}"
                    th:text="${category}">
                </option>

            </select>

        </div>


        <br>


        <div>

            <label for="cost">
                Costo (€)
            </label>

            <input
                type="number"
                id="cost"
                name="cost"
                min="0"
                step="0.01"
                value="0"
                required>

        </div>


        <br>


        <button type="submit">
            Aggiungi attività
        </button>

    </form>


    <br>


    <a th:href="@{/trips/{id}(id=${trip.id})}">
        Annulla
    </a>


</body>

</html>
