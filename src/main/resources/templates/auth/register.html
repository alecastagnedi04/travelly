<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registrazione - Travelly</title>
</head>

<body>

    <h1>Crea il tuo account</h1>

    <form
        th:action="@{/register}"
        th:object="${registrationForm}"
        method="post">

        <div>
            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                th:field="*{username}"
                required>

            <span
                th:if="${#fields.hasErrors('username')}"
                th:errors="*{username}">
                Errore username
            </span>
        </div>

        <br>


        <div>
            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                th:field="*{email}"
                required>

            <span
                th:if="${#fields.hasErrors('email')}"
                th:errors="*{email}">
                Errore email
            </span>
        </div>

        <br>


        <div>
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                th:field="*{password}"
                required>

            <span
                th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}">
                Errore password
            </span>
        </div>

        <br>


        <div>
            <label for="confirmPassword">
                Conferma password
            </label>

            <input
                type="password"
                id="confirmPassword"
                th:field="*{confirmPassword}"
                required>

            <span
                th:if="${#fields.hasErrors('confirmPassword')}"
                th:errors="*{confirmPassword}">
                Errore conferma password
            </span>
        </div>

        <br>

        <button type="submit">
            Registrati
        </button>

    </form>

    <p>
        Hai già un account?
        <a th:href="@{/login}">
            Accedi
        </a>
    </p>

</body>

</html>
