<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Aggiungi spesa - Travelly</title>
</head>

<body>

    <h1>Aggiungi spesa</h1>

    <p>
        Viaggio:
        <strong th:text="${trip.name}">
            Nome viaggio
        </strong>
    </p>

    <form
        th:action="@{/trips/{tripId}/expenses(tripId=${trip.id})}"
        method="post">

        <div>
            <label for="description">
                Descrizione
            </label>

            <input
                type="text"
                id="description"
                name="description"
                required>
        </div>

        <br>

        <div>
            <label for="amount">
                Importo (€)
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="0"
                step="0.01"
                required>
        </div>

        <br>

        <div>
            <label for="date">
                Data
            </label>

            <input
                type="date"
                id="date"
                name="date"
                required>
        </div>

        <br>

        <div>
            <label for="category">
                Categoria
            </label>

            <select
                id="category"
                name="category"
                required>

                <option
                    th:each="category : ${categories}"
                    th:value="${category}"
                    th:text="${category}">
                </option>

            </select>
        </div>

        <br>

        <div>
            <label for="paidById">
                Pagata da
            </label>

            <select
                id="paidById"
                name="paidById"
                required>

                <option
                    th:each="participant : ${participants}"
                    th:value="${participant.id}"
                    th:text="${participant.name}">
                </option>

            </select>
        </div>

        <br>

        <button type="submit">
            Aggiungi spesa
        </button>

    </form>

    <br>

    <a th:href="@{/trips/{id}(id=${trip.id})}">
        Annulla
    </a>

</body>

</html>
