<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Aggiungi spesa - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

    <div th:replace="~{fragments/navbar :: siteNavbar}"></div>


<main class="compact-form-page">


    <a
        class="back-link"
        th:href="@{/trips/{id}(id=${trip.id})}">

        ← Torna al viaggio

    </a>



    <section class="compact-form-card">


        <div class="compact-form-header">


            <span>
                SPESE
            </span>


            <h1>
                Aggiungi spesa
            </h1>


            <p>

                Viaggio:

                <strong th:text="${trip.name}">
                    Nome viaggio
                </strong>

            </p>


        </div>



        <div
            class="form-error-box"
            th:if="${expenseError != null}"
            th:text="${expenseError}">

            Errore spesa

        </div>



        <form
            class="travelly-form"
            th:action="@{/trips/{tripId}/expenses(tripId=${trip.id})}"
            method="post">


            <!-- DESCRIZIONE -->

            <div class="travelly-field">


                <label for="description">
                    Descrizione
                </label>


                <input
                    type="text"
                    id="description"
                    name="description"
                    placeholder="Es. Cena ristorante"
                    required>


            </div>



            <!-- IMPORTO + DATA -->

            <div class="travelly-form-row">


                <div class="travelly-field">


                    <label for="amount">
                        Importo (€)
                    </label>


                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0.01"
                        step="0.01"
                        placeholder="0.00"
                        required>


                </div>



                <div class="travelly-field">


                    <label for="date">
                        Data
                    </label>


                    <input
                        type="date"
                        id="date"
                        name="date"
                        required>


                </div>


            </div>



            <!-- CATEGORIA + PAGATORE -->

            <div class="travelly-form-row">


                <div class="travelly-field">


                    <label for="category">
                        Categoria
                    </label>


                    <select
                        id="category"
                        name="category"
                        required>


                        <option
                            th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category}">
                        </option>


                    </select>


                </div>



                <div class="travelly-field">


                    <label for="paidById">
                        Pagata da
                    </label>


                    <select
                        id="paidById"
                        name="paidById">


                        <option value="">
                            Da assegnare
                        </option>


                        <option
                            th:each="participant : ${participants}"
                            th:value="${participant.id}"
                            th:text="${participant.name}">
                        </option>


                    </select>


                    <small
                        class="field-help"
                        th:if="${#lists.isEmpty(participants)}">

                        Nessun partecipante ancora inserito.
                        Potrai assegnare il pagatore in seguito.

                    </small>


                </div>


            </div>



            <!-- AZIONI -->

            <div class="travelly-form-actions">


                <a
                    class="form-cancel-button"
                    th:href="@{/trips/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Aggiungi spesa

                    <span>
                        →
                    </span>

                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
