<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>
        Modifica spesa - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


<main class="container">


    <a
        class="back-link"
        th:href="@{/trips/{id}(id=${trip.id})}">

        ← Torna al viaggio

    </a>


    <h1>
        Modifica spesa
    </h1>


    <p>

        Viaggio:

        <strong th:text="${trip.name}">
            Nome viaggio
        </strong>

    </p>


    <form
        th:action="@{/trips/{tripId}/expenses/{expenseId}/edit(
            tripId=${trip.id},
            expenseId=${expense.id}
        )}"
        method="post">


        <!-- DESCRIZIONE -->

        <div>

            <label for="description">
                Descrizione
            </label>

            <input
                type="text"
                id="description"
                name="description"
                th:value="${expense.description}"
                required>

        </div>


        <br>


        <!-- IMPORTO -->

        <div>

            <label for="amount">
                Importo (€)
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                step="0.01"
                th:value="${expense.amount}"
                required>

        </div>


        <br>


        <!-- DATA -->

        <div>

            <label for="date">
                Data
            </label>

            <input
                type="date"
                id="date"
                name="date"
                th:value="${expense.date}"
                required>

        </div>


        <br>


        <!-- CATEGORIA -->

        <div>

            <label for="category">
                Categoria
            </label>

            <select
                id="category"
                name="category"
                required>


                <option
                    th:each="category : ${categories}"
                    th:value="${category}"
                    th:text="${category}"
                    th:selected="${category == expense.category}">
                </option>


            </select>

        </div>


        <br>


        <!-- PAGATORE -->

        <div>

            <label for="participantId">
                Pagata da
            </label>


            <select
                id="participantId"
                name="participantId">


                <option value="">
                    Da assegnare
                </option>


                <option
                    th:each="participant : ${participants}"
                    th:value="${participant.id}"
                    th:text="${participant.name}"
                    th:selected="${
                        expense.paidBy != null
                        and expense.paidBy.id == participant.id
                    }">
                </option>


            </select>

        </div>


        <br>


        <button
            class="button"
            type="submit">

            Salva modifiche

        </button>


        <a
            class="button button-secondary"
            th:href="@{/trips/{id}(id=${trip.id})}">

            Annulla

        </a>


    </form>


</main>


</body>

</html>
