<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Modifica spesa - Travelly
    </title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


<main class="compact-form-page">


    <a
        class="back-link"
        th:href="@{/trips/{id}(id=${trip.id})}">

        ← Torna al viaggio

    </a>



    <section class="compact-form-card">


        <div class="compact-form-header">


            <span>
                SPESE
            </span>


            <h1>
                Modifica spesa
            </h1>


            <p>

                Viaggio:

                <strong th:text="${trip.name}">
                    Nome viaggio
                </strong>

            </p>


        </div>



        <form
            class="travelly-form"
            th:action="@{/trips/{tripId}/expenses/{expenseId}/edit(
                tripId=${trip.id},
                expenseId=${expense.id}
            )}"
            method="post">


            <div class="travelly-field">

                <label for="description">
                    Descrizione
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    th:value="${expense.description}"
                    required>

            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="amount">
                        Importo (€)
                    </label>

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="0.01"
                        step="0.01"
                        th:value="${expense.amount}"
                        required>

                </div>



                <div class="travelly-field">

                    <label for="date">
                        Data
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        th:value="${expense.date}"
                        required>

                </div>


            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="category">
                        Categoria
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>


                        <option
                            th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category}"
                            th:selected="${category == expense.category}">
                        </option>


                    </select>

                </div>



                <div class="travelly-field">

                    <label for="participantId">
                        Pagata da
                    </label>

                    <select
                        id="participantId"
                        name="participantId">


                        <option value="">
                            Da assegnare
                        </option>


                        <option
                            th:each="participant : ${participants}"
                            th:value="${participant.id}"
                            th:text="${participant.name}"
                            th:selected="${
                                expense.paidBy != null
                                and expense.paidBy.id == participant.id
                            }">
                        </option>


                    </select>

                </div>


            </div>



            <div class="travelly-form-actions">


                <a
                    class="form-cancel-button"
                    th:href="@{/trips/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Salva modifiche

                    <span>→</span>

                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
