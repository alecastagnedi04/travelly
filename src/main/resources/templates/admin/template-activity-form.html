<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nuova attività - Travelly</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


<main class="trip-form-page">


    <a
        class="back-link"
        th:href="@{/admin/templates/{id}(id=${trip.id})}">

        ← Torna all'itinerario

    </a>



    <section class="trip-form-panel">


        <div class="trip-form-heading">

            <span>
                TRAVELLY GUIDE
            </span>

            <h2>
                Aggiungi attività
            </h2>

        </div>



        <form
            class="travelly-form"
            th:action="@{/admin/templates/{id}/activities(id=${trip.id})}"
            method="post">


            <div class="travelly-field">

                <label for="name">
                    Nome attività
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Es. Visita al Nyhavn"
                    required>

            </div>



            <div class="travelly-field">

                <label for="description">
                    Descrizione
                </label>

                <textarea
                    id="description"
                    name="description">
                </textarea>

            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="date">
                        Data
                    </label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        required>

                </div>


                <div class="travelly-field">

                    <label for="time">
                        Ora
                    </label>

                    <input
                        id="time"
                        name="time"
                        type="time"
                        required>

                </div>


            </div>



            <div class="travelly-field">

                <label for="location">
                    Luogo
                </label>

                <input
                    id="location"
                    name="location"
                    type="text"
                    placeholder="Es. Nyhavn, Copenhagen"
                    required>

            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="category">
                        Categoria
                    </label>

                    <select
                        id="category"
                        name="category"
                        required>


                        <option
                            value=""
                            disabled
                            selected>

                            Seleziona categoria

                        </option>


                        <option
                            th:each="category : ${categories}"
                            th:value="${category}"
                            th:text="${category}">
                        </option>


                    </select>

                </div>


                <div class="travelly-field">

                    <label for="cost">
                        Costo indicativo
                    </label>

                    <div class="budget-input-wrapper">

                        <input
                            id="cost"
                            name="cost"
                            type="number"
                            min="0"
                            step="0.01"
                            value="0"
                            required>

                        <span>€</span>

                    </div>

                </div>


            </div>



            <div class="travelly-form-actions">


                <a
                    class="form-cancel-button"
                    th:href="@{/admin/templates/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Aggiungi attività

                    <span>→</span>

                </button>


            </div>


        </form>


    </section>


</main>


</body>

</html>
