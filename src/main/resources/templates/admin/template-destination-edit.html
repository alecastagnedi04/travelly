<!DOCTYPE html>

<html
    lang="it"
    xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Modifica destinazione - Travelly</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>


<main class="trip-form-page">


    <a
        class="back-link"
        th:href="@{/admin/templates/{id}(id=${trip.id})}">

        ← Torna all'itinerario

    </a>



    <section class="trip-form-panel">


        <div class="trip-form-heading">

            <span>
                MODIFICA TAPPA
            </span>

            <h2>
                Destinazione
            </h2>

        </div>



        <form
            class="travelly-form"
            th:action="@{/admin/templates/{templateId}/destinations/{destinationId}/edit(
                templateId=${trip.id},
                destinationId=${destination.id}
            )}"
            method="post">


            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="city">
                        Città
                    </label>

                    <input
                        id="city"
                        name="city"
                        type="text"
                        th:value="${destination.city}"
                        required>

                </div>


                <div class="travelly-field">

                    <label for="country">
                        Paese
                    </label>

                    <input
                        id="country"
                        name="country"
                        type="text"
                        th:value="${destination.country}"
                        required>

                </div>


            </div>



            <div class="travelly-form-row">


                <div class="travelly-field">

                    <label for="arrivalDate">
                        Arrivo
                    </label>

                    <input
                        id="arrivalDate"
                        name="arrivalDate"
                        type="date"
                        th:value="${destination.arrivalDate}"
                        required>

                </div>


                <div class="travelly-field">

                    <label for="departureDate">
                        Partenza
                    </label>

                    <input
                        id="departureDate"
                        name="departureDate"
                        type="date"
                        th:value="${destination.departureDate}"
                        required>

                </div>


            </div>



            <div class="travelly-form-actions">

                <a
                    class="form-cancel-button"
                    th:href="@{/admin/templates/{id}(id=${trip.id})}">

                    Annulla

                </a>


                <button
                    class="form-submit-button"
                    type="submit">

                    Salva modifiche

                </button>

            </div>


        </form>


    </section>


</main>


</body>

</html>
